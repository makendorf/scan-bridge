<div class="glass-card">
    <div class="glass-card-header">
        <h2><i data-lucide="key"></i> Учётные данные</h2>
        <button class="btn btn-primary btn-sm" onclick="showAddCredential()">
            <i data-lucide="plus"></i> Добавить
        </button>
    </div>
    <table class="data-table">
        <thead>
            <tr>
                <th>Имя</th>
                <th>Тип</th>
                <th>Логин</th>
                <th>Хост</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="credentialsBody"></tbody>
    </table>
    <div id="credentialsEmpty" class="empty-state hidden">
        <i data-lucide="key"></i>
        <p>Нет сохранённых учётных данных</p>
    </div>
</div>

<!-- Modal добавления/редактирования -->
<div class="modal-overlay" id="credentialModal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="credentialModalTitle">Учётные данные</h2>
            <button class="btn-icon" onclick="closeModal('credentialModal')"><i data-lucide="x"></i></button>
        </div>
        <input type="hidden" id="credentialEditId" value="-1">
        <div class="form-grid">
            <div class="form-group">
                <label>Тип</label>
                <select id="fCredType" onchange="onCredentialTypeChange()">
                    <option value="windows">Windows</option>
                    <option value="ftp">FTP</option>
                    <option value="sftp">SFTP</option>
                </select>
            </div>
            <div class="form-group">
                <label>Имя</label>
                <input id="fCredName" placeholder="напр. FTP Главный">
            </div>
        </div>

        <!-- Windows fields -->
        <div id="credFieldsWindows">
            <div class="form-section-title">Windows</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Домен</label>
                    <input id="fCredDomain" placeholder="DOMAIN">
                </div>
                <div class="form-group">
                    <label>Логин</label>
                    <input id="fCredUsername" placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input id="fCredPassword" type="password">
                </div>
            </div>
        </div>

        <!-- FTP/SFTP fields -->
        <div id="credFieldsFtp" class="hidden">
            <div class="form-section-title">Подключение</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Хост</label>
                    <input id="fCredHost" placeholder="ftp.example.com">
                </div>
                <div class="form-group">
                    <label>Порт</label>
                    <input id="fCredPort" type="number" value="21">
                </div>
                <div class="form-group">
                    <label>Логин</label>
                    <input id="fCredFtpUser" placeholder="user">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input id="fCredFtpPass" type="password">
                </div>
            </div>
            <div class="form-group" id="credFtpPassiveGroup">
                <label class="checkbox-label">
                    <input type="checkbox" id="fCredPassive" checked> Пассивный режим
                </label>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-secondary" onclick="closeModal('credentialModal')">Отмена</button>
            <button class="btn btn-primary" onclick="saveCredential()">
                <i data-lucide="check"></i> Сохранить
            </button>
        </div>
    </div>
</div>
