<div class="glass-card">
    <div class="glass-card-header">
        <h2><i data-lucide="zap"></i> Группы действий</h2>
        <button class="btn btn-primary" onclick="addGroup()">
            <i data-lucide="plus"></i> Добавить группу
        </button>
    </div>
    <div class="info-banner">
        <i data-lucide="info"></i>
        Группы привязываются к сканерам. Действия внутри группы выполняются последовательно. Несколько групп на одном сканере работают параллельно.
    </div>
    <div id="groupCards" class="group-grid"></div>
    <div id="groupsEmpty" class="empty-state">
        <i data-lucide="zap"></i>
        <p>Нет групп действий. Создайте группу, добавьте в неё действия и привяжите к сканеру.</p>
    </div>
</div>
