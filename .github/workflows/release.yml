name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish win-x64
        run: dotnet publish src/ScanBridge.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      - name: Publish win-x86
        run: dotnet publish src/ScanBridge.csproj -c Release -r win-x86 --self-contained false -o publish/win-x86

      - name: Zip artifacts
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath publish/ScanBridge-win-x64.zip
          Compress-Archive -Path publish/win-x86/* -DestinationPath publish/ScanBridge-win-x86.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/ScanBridge-win-x64.zip
            publish/ScanBridge-win-x86.zip
          generate_release_notes: true
